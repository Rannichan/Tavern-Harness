<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Edge Android 只有在显式声明 interactive-widget=resizes-content 时才随软键盘
         收缩布局视口；否则 position: fixed 的 app-shell 不收缩，输入框会被键盘盖住。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#17120A" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('tav-theme-mode');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = mode === 'dark' || (mode !== 'light' && systemDark);
          const root = document.documentElement;
          const background = dark ? '#20160E' : '#F7F0E4';
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.backgroundColor = background;
          root.style.setProperty('--bg', background);
          root.style.setProperty('--surface', dark ? '#211A10' : '#FDFBF5');
          root.style.setProperty('--text', dark ? '#F2EADC' : '#241c10');
          root.style.setProperty('--text-dim', dark ? '#AA9C86' : '#7a6a50');
          document.querySelector('meta[name="theme-color"]').content = background;
        } catch {
          // Use the CSS fallback when browser storage is unavailable.
        }
      })();
    </script>
    <title>Tavern Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
