<!DOCTYPE html>
<html lang="zh-CN" style="scrollbar-gutter: stable;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki·Tavern Harness</title>
  <meta name="description" content="Tavern Harness 使用手册：从接入模型、角色工坊、群聊回合制，到生成式技能、持久化小游戏与分享——一册读完，酒馆任你玩。" />
  <link rel="icon" href="assets/icons/favicon.png" />
  <script src="assets/theme.js"></script>
  <script src="assets/wiki-i18n.js"></script>
  <link rel="stylesheet" href="assets/wiki.css" />
</head>
<body>
  <!-- 背景氛围 -->
  <div class="bg-layer" aria-hidden="true"><div class="bg-vignette"></div></div>
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  <!-- 顶栏 -->
  <header class="wtb">
    <button class="wburger" id="tocToggle" aria-label="打开目录">☰</button>
    <a class="wbrand" href="index.html">
      <img class="wbrand-mark" src="assets/icons/tavern-harness-logo.png" alt="" />
      <span class="wbrand-name">Tavern Harness</span>
      <span class="wbrand-sub">WIKI</span>
    </a>
    <nav class="wnav">
      <button class="wiki-search-toggle" id="wikiSearchToggle" type="button" aria-label="搜索 Wiki" aria-haspopup="dialog" aria-controls="wikiSearchDialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span>搜索</span>
        <kbd aria-hidden="true">⌘ K</kbd>
      </button>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换到日间模式">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a class="wiki-home-link" href="index.html" aria-label="返回主页" title="返回主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>返回主页</span></a>
    </nav>
  </header>

  <div class="wiki-search-dialog" id="wikiSearchDialog" role="dialog" aria-modal="true" aria-labelledby="wikiSearchTitle" hidden>
    <div class="wiki-search-backdrop" data-search-close></div>
    <section class="wiki-search-panel">
      <div class="wiki-search-input-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="wikiSearchInput" type="search" placeholder="搜索章节、功能或关键词" autocomplete="off" aria-describedby="wikiSearchHint" />
        <button class="wiki-search-close" type="button" data-search-close aria-label="关闭搜索">×</button>
      </div>
      <p class="wiki-search-hint" id="wikiSearchHint"><span id="wikiSearchTitle">搜索 Wiki</span><span><kbd>Esc</kbd> 关闭</span></p>
      <div class="wiki-search-results" id="wikiSearchResults" role="status" aria-live="polite"></div>
    </section>
  </div>

  <div class="layout">
    <!-- 侧栏目录（由 chapters/*.js 自动生成） -->
    <aside class="wsb" id="wsb" aria-label="Wiki 目录"></aside>
    <div class="wsb-overlay" id="wsbOverlay" aria-hidden="true"></div>

    <!-- 主内容（章节由 chapters/*.js 装配进 #wcontent-top） -->
    <main class="wmain">
      <article class="wcontent">
        <!-- HERO（静态壳） -->
        <header class="wiki-hero reveal">
          <h1>酒馆<span class="em">经营手册</span>，<br />从开张到传奇。</h1>
          <p class="hero-sub">本 Wiki 按真实使用顺序编排：接入模型 → 开一局对话 → 搭建世界与角色 → 解锁技能与沙盒 → 打包分享。</p>
          <div class="wiki-chips">
            <a class="chip" href="https://github.com/Rannichan/Tavern-Harness" target="_blank" rel="noopener noreferrer"><img class="chip-icon" src="https://cdn.simpleicons.org/github/ffcb8b" alt="" />项目 Github 地址</a>
            <a class="chip" href="https://discord.gg/kPSWGeaHx" target="_blank" rel="noopener noreferrer"><img class="chip-icon" src="https://cdn.simpleicons.org/discord/ffcb8b" alt="" />Discord 讨论社区</a>
            <a class="chip" href="https://www.bilibili.com/" target="_blank" rel="noopener noreferrer"><img class="chip-icon" src="https://cdn.simpleicons.org/bilibili/ffcb8b" alt="" />Bilibili 介绍视频</a>
          </div>
          <div class="read-tip"><span class="rt-ic">🕯</span><span>小贴士：左上角点击可以展开目录。</span></div>
        </header>

        <!-- 章节 + 底部导航 + 页脚，全部由 assets/wiki.js 装配 -->
        <div id="wcontent-top"></div>
      </article>
    </main>
  </div>

  <!-- 章节内容：一章一文件，按编号顺序加载 -->
  <!-- 新增章节：在 wiki/chapters/ 新建 NN-name.js，并在此处按顺序加一行 <script> -->
  <script src="wiki/chapters/01-overview.js"></script>
  <script src="wiki/chapters/02-quickstart.js"></script>
  <script src="wiki/chapters/03-provider.js"></script>
  <script src="wiki/chapters/04-privacy.js"></script>
  <script src="wiki/chapters/05-session.js"></script>
  <script src="wiki/chapters/06-chat.js"></script>
  <script src="wiki/chapters/07-groups.js"></script>
  <script src="wiki/chapters/08-workshop.js"></script>
  <script src="wiki/chapters/10-export.js"></script>
  <script src="wiki/chapters/15-workspace.js"></script>
  <script src="wiki/chapters/18-faq.js"></script>
  <script src="assets/wiki.js"></script>
</body>
</html>
